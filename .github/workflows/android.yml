name: Android APK (TMS Склад)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Автоинкремент versionCode — используем номер CI-запуска (всегда возрастает)
      - name: Bump versionCode
        run: |
          node -e "
            const fs = require('fs');
            const f = 'app_dist/version.json';
            const v = JSON.parse(fs.readFileSync(f));
            v.versionCode = ${{ github.run_number }};
            fs.writeFileSync(f, JSON.stringify(v, null, 2) + '\n');
            console.log('versionCode ->', v.versionCode, '| versionName ->', v.versionName);
          "

      # Декодируем keystore из GitHub Secret (base64) в файл release.jks
      # Как сгенерировать keystore и добавить в Secrets — см. android/README.md
      - name: Decode release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/release.jks

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tms-sklad-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
