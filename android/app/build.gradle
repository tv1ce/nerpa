plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.tms.warehouse'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.tms.warehouse'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Ключи задаются через переменные окружения (локально или GitHub Secrets).
            // Если KEYSTORE_BASE64 не задан — Gradle падает с понятной ошибкой при попытке
            // собрать release без подписи. Debug-сборка использует стандартный debug keystore.
            storeFile     file("${rootDir}/release.jks")
            storePassword (System.getenv("KEYSTORE_PASS") ?: "")
            keyAlias      (System.getenv("KEY_ALIAS")     ?: "tms")
            keyPassword   (System.getenv("KEY_PASS")      ?: "")
        }
    }

    buildTypes {
        debug {
            // debug-сборка остаётся с debug keystore — для разработки
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
}
