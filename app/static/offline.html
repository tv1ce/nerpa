<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нет связи — NERPA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0F1A2E;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1e2d45;
      border: 1px solid #2d4a6e;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
      display: block;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .5; }
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #f1f5f9;
    }

    p {
      font-size: .9rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      text-decoration: none;
    }
    .btn:hover { background: #1d4ed8; }

    .hint {
      margin-top: 20px;
      font-size: .78rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📦</span>
    <h1>Нет связи с сервером</h1>
    <p>
      Приложение недоступно. Проверьте подключение к Wi-Fi
      или корпоративной сети и попробуйте снова.
    </p>
    <button class="btn" onclick="location.reload()">Повторить</button>
    <p class="hint">NERPA — Система управления поставками</p>
  </div>
</body>
</html>
