<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смена пароля — TMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Fira Sans', system-ui, 'Segoe UI', sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, #1D4ED8 0%, transparent 55%),
                  linear-gradient(160deg, #0F1A2E 0%, #0B1424 100%);
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 18px; padding: 40px 38px; width: 100%; max-width: 420px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .logo-mark {
      width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 15px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #2563EB 0%, #F97316 150%);
      color: #fff; box-shadow: 0 10px 24px rgba(37,99,235,.4);
      font-size: 1.8rem;
    }
    .brand { text-align: center; font-weight: 700; font-size: 1.3rem; color: #0F172A; margin-bottom: 4px; }
    .sub { text-align: center; color: #64748B; font-size: .85rem; margin-bottom: 28px; }
    .form-label { font-weight: 500; font-size: .84rem; color: #475569; }
    .form-control { border-color: #CBD5E1; border-radius: 9px; padding: 10px 12px; }
    .form-control:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .btn-primary { background: #2563EB; border: none; width: 100%; padding: 11px; font-weight: 600; border-radius: 9px; }
    .btn-primary:hover { background: #1D4ED8; }
    .forced-banner {
      background: #FEF3C7; border: 1px solid #F59E0B; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 20px; font-size: .85rem; color: #92400E;
    }
    .req { font-size: .75rem; color: #94A3B8; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-mark" aria-hidden="true">🔐</div>
    <div class="brand">Смена пароля</div>
    <div class="sub">TMS — Управление поставками</div>

    {% if forced %}
    <div class="forced-banner">
      <strong>⚠️ Требуется смена пароля.</strong><br>
      Вы вошли с паролем по умолчанию. Пожалуйста, установите новый пароль для продолжения работы.
    </div>
    {% endif %}

    {% if error %}
    <div class="alert alert-danger py-2 text-center" style="font-size:.85rem; border-radius:9px">{{ error }}</div>
    {% endif %}

    <form method="post" action="/auth/change-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

      <div class="mb-3">
        <label class="form-label" for="current_password">Текущий пароль</label>
        <input type="password" id="current_password" name="current_password"
               class="form-control" required autocomplete="current-password">
      </div>

      <div class="mb-3">
        <label class="form-label" for="new_password">Новый пароль</label>
        <input type="password" id="new_password" name="new_password"
               class="form-control" required autocomplete="new-password" minlength="6">
        <p class="req">Минимум 6 символов</p>
      </div>

      <div class="mb-4">
        <label class="form-label" for="confirm_password">Подтвердите новый пароль</label>
        <input type="password" id="confirm_password" name="confirm_password"
               class="form-control" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary">Сменить пароль</button>
    </form>

    {% if not forced %}
    <p class="text-center mt-3" style="font-size:.8rem">
      <a href="javascript:history.back()" style="color:#64748B">← Назад</a>
    </p>
    {% endif %}
  </div>

  <script>
    // Простая клиентская проверка совпадения паролей
    document.querySelector('form').addEventListener('submit', function(e) {
      var np = document.getElementById('new_password').value;
      var cp = document.getElementById('confirm_password').value;
      if (np !== cp) {
        e.preventDefault();
        alert('Пароли не совпадают');
        document.getElementById('confirm_password').focus();
      }
    });
  </script>
</body>
</html>
