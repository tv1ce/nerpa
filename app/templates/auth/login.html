<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — TMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #1e2a3a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #fff; border-radius: 14px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
    .logo { font-size: 2.5rem; text-align: center; margin-bottom: 8px; }
    .brand { text-align: center; font-weight: 700; font-size: 1.3rem; color: #1e2a3a; margin-bottom: 4px; }
    .sub { text-align: center; color: #6c757d; font-size: .85rem; margin-bottom: 28px; }
    .btn-login { background: #f39c12; color: #fff; border: none; width: 100%; padding: 10px; font-weight: 600; border-radius: 8px; }
    .btn-login:hover { background: #d68910; color: #fff; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">🥜</div>
    <div class="brand">TMS Поставки</div>
    <div class="sub">Система управления поставками</div>

    {% if error %}
    <div class="alert alert-danger py-2 text-center" style="font-size:.85rem">{{ error }}</div>
    {% endif %}

    <form method="post" action="/auth/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Логин</label>
        <input type="text" name="username" class="form-control" placeholder="admin" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Пароль</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn-login btn">Войти</button>
    </form>
    <p class="text-center text-muted mt-3" style="font-size:.75rem">По умолчанию: admin / admin</p>
  </div>
</body>
</html>
