<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Заказ принят — {{ company.short_name or company.name or '' }}</title>
  <link rel="icon" href="/static/favicon.ico">
  <style>
    :root {
      --paper: #ffffff; --ink: #09090b; --ink-2: #71717a;
      --line: #e4e4e7; --accent: #09090b; --accent-soft: #f4f4f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px; line-height: 1.5; background: var(--paper); color: var(--ink);
      padding: 24px; -webkit-font-smoothing: antialiased;
    }
    .box { max-width: 440px; text-align: center; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      display: grid; place-items: center;
    }
    h1 { font-size: 1.5rem; letter-spacing: -.02em; margin: 0 0 10px; }
    p { color: var(--ink-2); margin: 0 0 26px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 52px; padding: 0 28px; border-radius: 12px;
      background: var(--accent); color: #fff; font-weight: 650; text-decoration: none;
      transition: background 180ms ease;
    }
    .btn:hover { background: #27272a; }
    .foot { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line);
            color: var(--ink-2); font-size: .82rem; }
    .foot a { color: var(--ink-2); }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0ms !important; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <h1>Заказ принят</h1>
    <p>
      Он уже у вашего менеджера — тот подтвердит состав, сумму и дату доставки
      и свяжется с вами, если нужно что-то уточнить.
    </p>
    <a class="btn" href="/shop/{{ token }}">Вернуться в кабинет</a>
    <div class="foot">
      {{ company.brand_name or company.name or '' }}
      {% if company and company.phone %} · <a href="tel:{{ company.phone }}">{{ company.phone }}</a>{% endif %}
    </div>
  </div>
</body>
</html>
