<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Заказ принят — {{ company.short_name or company.name or '' }}</title>
  <link rel="icon" href="/static/favicon.ico">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", "Fira Sans", Roboto, sans-serif;
      background: #f1f5f9; color: #0f172a; padding: 24px; line-height: 1.5;
    }
    .box { text-align: center; max-width: 440px; }
    .ico { font-size: 3.4rem; margin-bottom: 10px; }
    h1 { font-size: 1.45rem; margin: 0 0 10px; }
    p { color: #64748b; margin: 0 0 22px; }
    .btn {
      display: inline-block; background: #16a34a; color: #fff; text-decoration: none;
      border-radius: 14px; padding: 14px 26px; font-weight: 700;
    }
    .foot { margin-top: 26px; color: #94a3b8; font-size: .82rem; }
    .foot a { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="ico">✅</div>
    <h1>Заказ принят</h1>
    <p>
      Он уже у вашего менеджера — тот подтвердит состав, сумму и дату доставки
      и свяжется с вами, если что-то нужно уточнить.
    </p>
    <a class="btn" href="/shop/{{ token }}">Собрать ещё один заказ</a>
    <div class="foot">
      {{ company.brand_name or company.name or '' }}
      {% if company and company.phone %} · <a href="tel:{{ company.phone }}">{{ company.phone }}</a>{% endif %}
    </div>
  </div>
</body>
</html>
