{% extends "base.html" %}
{% block title %}Новый поставщик{% endblock %}
{% block page_title %}Новый поставщик{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm" style="max-width:720px">
  <div class="card-body">
    <form method="post" action="/sourcing/vendors/new">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Название <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Статус</label>
          <select name="status" class="form-select">
            {% for val, label in vendor_statuses.items() %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Направление</label>
          <select name="category_id" class="form-select">
            <option value="0">— без направления —</option>
            {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Регион</label>
          <input type="text" name="region" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Сайт</label>
          <input type="text" name="website" class="form-control" placeholder="https://">
        </div>
        <div class="col-md-6">
          <label class="form-label">Контактное лицо</label>
          <input type="text" name="contact_person" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Телефон</label>
          <input type="text" name="phone" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="text" name="email" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">Заметки</label>
          <textarea name="notes" class="form-control" rows="3"></textarea>
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-accent"><i class="bi bi-check-lg me-1"></i>Сохранить</button>
        <a href="/sourcing/vendors" class="btn btn-link text-muted">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
