{% extends "base_warehouse.html" %}

{% block title %}Новое списание{% endblock %}
{% block page_title %}Новое списание{% endblock %}

{% block content %}
{% if error %}
<div class="wm-alert wm-alert-warn"><i class="bi bi-exclamation-triangle-fill"></i><span>{{ error }}</span></div>
{% endif %}

<form method="post" action="/warehouse/writeoffs/new" id="writeoffForm">
  <div class="wm-form-group">
    <label class="wm-form-label">Склад</label>
    <select name="warehouse_id" class="wm-form-control">
      {% for w in warehouses %}
      <option value="{{ w.id }}" {% if w.id == default_warehouse_id %}selected{% endif %}>{{ w.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="wm-form-group">
    <label class="wm-form-label">Причина / корреспонденция</label>
    <select name="reason_id" class="wm-form-control">
      {% for r in reasons %}
      <option value="{{ r.id }}">{{ r.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="wm-section-title" style="margin-top:8px"><span>Номенклатура</span></div>
  <div id="woLines" class="wm-card" style="margin-bottom:10px"></div>

  <button type="button" onclick="openWoPicker()"
          style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;margin-bottom:14px;border:1.5px dashed var(--wm-border);border-radius:10px;color:var(--wm-brand);background:#fff;font-weight:700">
    <i class="bi bi-plus-lg"></i> Добавить товар
  </button>

  <div class="wm-form-group">
    <label class="wm-form-label">Примечание</label>
    <textarea name="notes" class="wm-form-control" rows="2"
              style="height:auto;padding:14px;resize:none;line-height:1.5"
              placeholder="Необязательно"></textarea>
  </div>

  <input type="hidden" name="products_json" id="productsJson" value="[]">
  <button type="submit" class="wm-btn-assembled" style="background:#DC2626"
          onclick="return _woValidate()">
    <i class="bi bi-trash"></i> Создать списание
  </button>
</form>
{% endblock %}

{% block scripts %}
<script>
var _woLines = [];
window._mpProducts = [
  {% for p in products %}
  { id: {{ p.id }}, name: {{ p.name|tojson }}, article: {{ (p.article or '')|tojson }},
    unit: {{ p.unit|tojson }}, category: {{ (p.category or '')|tojson }} },
  {% endfor %}
];
window._mpBalances = {};

function _woRender() {
  var box = document.getElementById('woLines');
  if (!_woLines.length) {
    box.innerHTML = '<div class="wm-empty" style="padding:24px"><i class="bi bi-box-seam"></i><p style="font-size:.85rem;color:var(--wm-muted)">Позиции ещё не добавлены</p></div>';
  } else {
    box.innerHTML = _woLines.map(function(l, i) {
      return '<div class="wm-stock-item">' +
        '<div class="wm-stock-info"><div class="wm-stock-name">' + _woEsc(l.name) + '</div></div>' +
        '<input type="number" step="any" min="0.001" value="' + l.quantity + '" ' +
        'oninput="_woLines[' + i + '].quantity = parseFloat(this.value)||0" ' +
        'style="width:74px;text-align:right;border:1.5px solid var(--wm-border);border-radius:8px;padding:6px 8px;font-weight:700;margin-right:8px">' +
        '<button type="button" onclick="_woRemove(' + i + ')" style="border:none;background:none;color:#DC2626;font-size:1.2rem;line-height:1;padding:4px"><i class="bi bi-x-circle"></i></button>' +
        '</div>';
    }).join('');
  }
}
function _woEsc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _woRemove(i) { _woLines.splice(i, 1); _woRender(); }
function openWoPicker() {
  _mp.open(function(p) {
    var existing = _woLines.find(function(l){ return l.product_id === p.id; });
    if (existing) { existing.quantity += 1; } else { _woLines.push({ product_id: p.id, name: p.name, unit: p.unit, quantity: 1 }); }
    _woRender();
  });
}
function _woValidate() {
  if (!_woLines.length) { alert('Добавьте хотя бы один товар'); return false; }
  document.getElementById('productsJson').value = JSON.stringify(_woLines.map(function(l){
    return { product_id: l.product_id, product_name: l.name, quantity: l.quantity };
  }));
  return confirm('Создать списание на ' + _woLines.length + ' поз.? Действие нельзя отменить.');
}
_woRender();
</script>
{% endblock %}
