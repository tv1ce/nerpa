# /etc/logrotate.d/tms
#
# Установка:
#   sudo cp logrotate.conf /etc/logrotate.d/tms
#   sudo logrotate -d /etc/logrotate.d/tms   # проверить без применения
#   sudo logrotate -f /etc/logrotate.d/tms   # применить принудительно
#
# Ротация запускается системным cron (/etc/cron.daily/logrotate) раз в сутки.
# Python RotatingFileHandler ротирует по размеру независимо (10 МБ × 5 файлов);
# этот конфиг добавляет временну́ю ротацию + сжатие для долгосрочного хранения.

/opt/tms/logs/*.log {
    daily                   # ротировать ежедневно
    rotate 30               # хранить 30 дней
    compress                # gzip старых файлов
    delaycompress           # сжимать файл не сразу, а на следующей ротации
    missingok               # не ошибаться если файл отсутствует
    notifempty              # не ротировать пустой файл
    copytruncate            # атомарный swap без перезапуска процесса
                            # (RotatingFileHandler держит файл открытым)
    dateext                 # суффикс вида .2026-06-04 вместо .1
    dateformat -%Y-%m-%d
    su tms tms              # владелец файлов
}

# Nginx access/error logs (если есть)
/var/log/nginx/tms*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        nginx -s reopen 2>/dev/null || true
    endscript
}
