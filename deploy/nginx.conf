# /etc/nginx/sites-available/tms
#
# Установка:
#   sudo cp nginx.conf /etc/nginx/sites-available/tms
#   sudo ln -s /etc/nginx/sites-available/tms /etc/nginx/sites-enabled/tms
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS-сертификат (Let's Encrypt):
#   sudo certbot --nginx -d tms.ваш-домен.ru
#   (certbot сам заполнит ssl_certificate / ssl_certificate_key ниже)
#
# Замените ВАШ_ДОМЕН на реальный домен или IP.

upstream tms_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP → HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name ВАШ_ДОМЕН;

    # ACME challenge для Let's Encrypt (certbot оставляет эту директорию)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ВАШ_ДОМЕН;

    # --- TLS (certbot заполняет автоматически) ---
    ssl_certificate     /etc/letsencrypt/live/ВАШ_ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ВАШ_ДОМЕН/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Заголовки безопасности ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-Frame-Options           SAMEORIGIN                             always;
    add_header Referrer-Policy           strict-origin-when-cross-origin        always;

    # --- Лимиты ---
    client_max_body_size 15m;   # макс. размер загружаемых файлов (шаблоны договоров, лого)

    # --- Статика — отдаём напрямую, без Python ---
    location /static/ {
        alias /opt/tms/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Загруженные файлы (логотип) ---
    location /static/uploads/ {
        alias /opt/tms/app/static/uploads/;
        expires 1d;
        access_log off;
    }

    # --- Health-check (без логирования, чтоб не засорять) ---
    location = /health {
        proxy_pass http://tms_app;
        access_log off;
    }

    # --- Service Worker и манифест PWA (нет кэша — браузер должен видеть актуальную версию) ---
    location ~ ^/(sw\.js|manifest\.webmanifest)$ {
        proxy_pass http://tms_app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Всё остальное → FastAPI ---
    location / {
        proxy_pass         http://tms_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
